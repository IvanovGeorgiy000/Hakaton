server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 15m;  # загрузка фото на проверку

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # данные и кадры с камер отдаёт бэкенд
    location /api/   { proxy_pass http://backend:8100; proxy_set_header Host $host; proxy_read_timeout 60s; }
    # рамки техники в реальном времени — WebSocket: соединение живёт, пока открыт экран с камерами
    location = /api/tracks {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
    location /media/ { proxy_pass http://backend:8100; expires 7d; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }  # одностраничное приложение
    # index.html не кэшируем: после обновления браузер сразу получает ссылки на новые файлы /assets/,
    # иначе открытая вкладка просит старые файлы, которых уже нет
    location = /index.html { add_header Cache-Control "no-cache"; }
}
