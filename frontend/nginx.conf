server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 15m;  # загрузка фото на проверку

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # данные и кадры с камер отдаёт бэкенд
    location /api/   { proxy_pass http://backend:8100; proxy_set_header Host $host; proxy_read_timeout 60s; }
    location /media/ { proxy_pass http://backend:8100; expires 7d; }

    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; }  # одностраничное приложение
}
