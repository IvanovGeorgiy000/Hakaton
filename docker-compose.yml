# Весь стенд одной командой:  docker compose up --build
#   интерфейс — http://localhost:8080, API и Swagger — http://localhost:8100/docs, видео (WebRTC) — :8889
# Порты можно сменить: WEB_PORT=8081 API_PORT=8101 VIDEO_PORT=8890 VIDEO_UDP_PORT=8190 docker compose up --build
# Открываете стенд с другого устройства (телефон в той же сети) — укажите адрес этого компьютера:
#   VIDEO_PUBLIC_HOST=192.168.1.10 docker compose up
# Технику на видео распознаёт своя модель (backend/models/detector.onnx) прямо в бэкенде — и на кадрах раз в 2 с, и рамками
# в реальном времени по видео камер, которые смотрят. В Docker она считает только на процессоре: на Mac с M4 это ≈ 0,2 с
# на кадр против 0,035 с с CoreML без Docker — для показа на Mac бэкенд лучше запускать без Docker (см. README).
# Вместо неё — имитация внешнего сервиса разметки (рамки по разметке демо-роликов):
#   SK_TRACKER_URL=ws://tracker:8200/stream SK_TRACKER_API_KEY=dev-tracker-key docker compose --profile tracker up --build
# Внешний сервис разметки на другом компьютере: он читает видео по RTSP (порт 8554, логин sk-tracker, пароль — ключ)
# и должен знать адрес этого компьютера:
#   SK_TRACKER_URL=ws://<адрес сервиса>:8200/stream SK_TRACKER_API_KEY=<ключ> SK_TRACKER_RTSP_URL=rtsp://192.168.1.10:8554 \
#   SK_ANALYSIS_PROVIDER=push docker compose up --build
# Работы по камерам — два сервиса аналитики коллеги (контракт frame-analysis-v1, backend/docs). Пока их образов нет —
# имитация обоих (один контейнер, два адреса):
#   DETERMINISTIC_SERVICE_URL=http://analytics:8300/deterministic VLM_LLM_SERVICE_URL=http://analytics:8300/vlm_llm \
#   docker compose --profile analytics up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stroykontrol
      POSTGRES_PASSWORD: stroykontrol  # пароль стенда; для реальной установки задайте свой
      POSTGRES_DB: stroykontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroykontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  # шлюз видео: забирает RTSP с камер и отдаёт браузеру WebRTC; потоки камер заводит сам бэкенд через API
  video:
    image: bluenviron/mediamtx:1.21.1
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_APIADDRESS: :9997  # API — только внутри сети стенда (порт наружу не открыт)
      MTX_AUTHHTTPADDRESS: http://backend:8100/api/video/auth
      MTX_WEBRTCADDITIONALHOSTS: ${VIDEO_PUBLIC_HOST:-127.0.0.1}  # адрес, по которому браузер достучится до видео
      MTX_WEBRTCLOCALUDPADDRESS: :${VIDEO_UDP_PORT:-8189}  # WebRTC сообщает браузеру этот порт — снаружи он должен быть тем же
    ports:
      - "${VIDEO_PORT:-8889}:8889"
      - "${VIDEO_UDP_PORT:-8189}:${VIDEO_UDP_PORT:-8189}/udp"
      # RTSP — для внешнего сервиса разметки: читать потоки камер можно только с учёткой (sk-tracker или токен входа)
      - "${VIDEO_RTSP_PORT:-8554}:8554"

  backend:
    build: ./backend
    environment:
      SK_DATABASE_URL: postgresql+asyncpg://stroykontrol:stroykontrol@db:5432/stroykontrol
      SK_SECRET_KEY: ${SK_SECRET_KEY:-change-me-before-real-use}
      SK_DEMO_MODE: ${SK_DEMO_MODE:-true}
      SK_DEMO_PASSWORD: ${SK_DEMO_PASSWORD:-demo}
      SK_CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}
      SK_VIDEO_API_URL: http://video:9997
      SK_VIDEO_RTSP_URL: rtsp://video:8554
      SK_VIDEO_WEBRTC_URL: http://${VIDEO_PUBLIC_HOST:-localhost}:${VIDEO_PORT:-8889}
      SK_FRAME_INTERVAL_S: ${SK_FRAME_INTERVAL_S:-2}
      SK_CHECK_INTERVAL_S: ${SK_CHECK_INTERVAL_S:-60}
      SK_ANALYSIS_PROVIDER: ${SK_ANALYSIS_PROVIDER:-auto}  # auto — своя модель; mock — демо-разметка роликов
      SK_ANALYSIS_API_URL: ${SK_ANALYSIS_API_URL:-}
      SK_ANALYSIS_API_KEY: ${SK_ANALYSIS_API_KEY:-}
      SK_INGEST_API_KEY: ${SK_INGEST_API_KEY:-}
      SK_REALTIME_FPS: ${SK_REALTIME_FPS:-8}  # рамки своей моделью по видео камер, которые смотрят; 0 — только раз в 2 с
      # ядер на модель: в Docker Desktop для Mac 4 потока быстрее всех ядер (0,22 с против 0,35: в ВМ вперемешку быстрые
      # и медленные ядра); на Linux-сервере можно 0 — решит ONNX Runtime
      SK_DETECTOR_THREADS: ${SK_DETECTOR_THREADS:-4}
      SK_TRACKER_URL: ${SK_TRACKER_URL:-}  # WebSocket внешнего сервиса разметки; пусто — рамки своей модели
      SK_TRACKER_API_KEY: ${SK_TRACKER_API_KEY:-}
      SK_TRACKER_RTSP_URL: ${SK_TRACKER_RTSP_URL:-}  # адрес видеошлюза для сервиса на другом компьютере
      SK_TRACKER_VIDEO_DELAY_MS: ${SK_TRACKER_VIDEO_DELAY_MS:-150}
      # сервисы аналитики коллеги — базовые адреса без пути метода; пусто — работы по камерам не определяются
      DETERMINISTIC_SERVICE_URL: ${DETERMINISTIC_SERVICE_URL:-}
      VLM_LLM_SERVICE_URL: ${VLM_LLM_SERVICE_URL:-}
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:-}
      ANALYTICS_HTTP_TIMEOUT_SECONDS: ${ANALYTICS_HTTP_TIMEOUT_SECONDS:-1020}
      SK_ANALYTICS_INTERVAL_MIN: ${SK_ANALYTICS_INTERVAL_MIN:-20}
    volumes:
      - media:/app/data
    depends_on:
      db:
        condition: service_healthy
      video:
        condition: service_started
    ports:
      - "${API_PORT:-8100}:8100"

  # имитация сервиса разметки (детектор + трекер): рамки по демо-роликам 10 раз в секунду.
  # Запускается только с профилем: docker compose --profile tracker up
  tracker:
    profiles: [tracker]
    build: ./backend
    command: ["/app/.venv/bin/uvicorn", "app.mock_tracker:app", "--host", "0.0.0.0", "--port", "8200"]
    healthcheck:
      disable: true
    environment:
      MOCK_TRACKER_BACKEND_URL: http://backend:8100
      SK_TRACKER_API_KEY: ${SK_TRACKER_API_KEY:-}

  # имитация двух сервисов аналитики коллеги по его контракту: /deterministic и /vlm_llm. Настоящие придут образами —
  # тогда здесь будут они. Запускается только с профилем: docker compose --profile analytics up
  analytics:
    profiles: [analytics]
    build: ./backend
    command: ["/app/.venv/bin/uvicorn", "app.mock_analytics:app", "--host", "0.0.0.0", "--port", "8300"]
    healthcheck:
      disable: true
    environment:
      ANALYTICS_SERVICE_TOKEN: ${ANALYTICS_SERVICE_TOKEN:-}

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  media:
